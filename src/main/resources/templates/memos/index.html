<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메모 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- 헤더 -->
<header class="bg-emerald-700 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
        <h1 class="text-2xl font-bold tracking-wide">메모 관리</h1>
        <button onclick="openCreateModal()"
                class="bg-white text-emerald-700 font-semibold px-4 py-2 rounded-lg hover:bg-emerald-100 transition">
            + 메모 추가
        </button>
    </div>
</header>

<!-- 필터 바 -->
<div class="max-w-6xl mx-auto px-4 mt-6">
    <div class="bg-white rounded-xl shadow p-4 flex flex-wrap gap-3 items-end">
        <div class="flex-1 min-w-[200px]">
            <label class="block text-sm font-medium text-gray-600 mb-1">제목 검색</label>
            <input id="searchTitle" type="text" placeholder="제목 입력..."
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400" />
        </div>
        <div class="min-w-[160px]">
            <label class="block text-sm font-medium text-gray-600 mb-1">태그 검색</label>
            <input id="searchTag" type="text" placeholder="태그 입력..."
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400" />
        </div>
        <button onclick="loadMemos()"
                class="bg-emerald-600 text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-emerald-700 transition">
            검색
        </button>
        <button onclick="resetSearch()"
                class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-300 transition">
            초기화
        </button>
    </div>
</div>

<!-- 목록 -->
<main class="max-w-6xl mx-auto px-4 mt-6 pb-16">
    <div id="loadingSpinner" class="hidden flex justify-center py-10">
        <svg class="animate-spin h-8 w-8 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
        </svg>
    </div>
    <div id="emptyState" class="hidden text-center py-20 text-gray-400">
        <div class="text-5xl mb-4">📝</div>
        <p class="text-lg">등록된 메모가 없습니다.</p>
    </div>
    <div id="memoGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
</main>

<!-- 생성/수정 모달 -->
<div id="formModal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg">
        <div class="flex items-center justify-between px-6 py-4 border-b">
            <h2 id="modalTitle" class="text-lg font-bold text-gray-800">메모 추가</h2>
            <button onclick="closeFormModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
        </div>
        <form id="memoForm" class="px-6 py-5 space-y-4">
            <input type="hidden" id="formId" />
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">제목 <span class="text-red-500">*</span></label>
                <input id="formTitle" type="text" required
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400"
                       placeholder="메모 제목" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">내용</label>
                <textarea id="formContent" rows="5"
                          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400"
                          placeholder="메모 내용 입력..."></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">태그 <span class="text-xs text-gray-400">(쉼표로 구분)</span></label>
                <input id="formTags" type="text"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400"
                       placeholder="업무,중요,참고" />
            </div>
            <div id="formError" class="hidden bg-red-50 border border-red-300 text-red-600 text-sm rounded-lg px-3 py-2"></div>
        </form>
        <div class="flex justify-end gap-3 px-6 py-4 border-t bg-gray-50 rounded-b-2xl">
            <button onclick="closeFormModal()"
                    class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 transition">
                취소
            </button>
            <button onclick="submitForm()"
                    class="px-5 py-2 text-sm font-semibold text-white bg-emerald-600 rounded-lg hover:bg-emerald-700 transition">
                저장
            </button>
        </div>
    </div>
</div>

<!-- 알림 토스트 -->
<div id="toast" class="fixed bottom-6 right-6 z-50 hidden">
    <div id="toastContent" class="px-5 py-3 rounded-xl shadow-lg text-white text-sm font-medium"></div>
</div>

<script>
    const API = '/api/memos';

    function showToast(message, success = true) {
        const toast = document.getElementById('toast');
        const content = document.getElementById('toastContent');
        content.textContent = message;
        content.className = 'px-5 py-3 rounded-xl shadow-lg text-white text-sm font-medium ' +
            (success ? 'bg-green-500' : 'bg-red-500');
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    async function loadMemos() {
        const spinner = document.getElementById('loadingSpinner');
        const grid = document.getElementById('memoGrid');
        const empty = document.getElementById('emptyState');

        spinner.classList.remove('hidden');
        grid.innerHTML = '';
        empty.classList.add('hidden');

        const tag = document.getElementById('searchTag').value.trim();
        const searchTitle = document.getElementById('searchTitle').value.trim().toLowerCase();

        let url = API;
        if (tag) url += '?tag=' + encodeURIComponent(tag);

        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error('서버 오류');
            let memos = await res.json();
            if (searchTitle) memos = memos.filter(m => m.title.toLowerCase().includes(searchTitle));

            spinner.classList.add('hidden');
            if (memos.length === 0) { empty.classList.remove('hidden'); return; }
            memos.forEach(m => grid.appendChild(createCard(m)));
        } catch (e) {
            spinner.classList.add('hidden');
            showToast('목록 로드 실패: ' + e.message, false);
        }
    }

    function resetSearch() {
        document.getElementById('searchTitle').value = '';
        document.getElementById('searchTag').value = '';
        loadMemos();
    }

    function createCard(m) {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl shadow hover:shadow-md transition p-5 flex flex-col gap-3';
        const tags = m.tags ? m.tags.split(',').map(t => t.trim()).filter(Boolean) : [];
        const tagHtml = tags.map(t =>
            `<span class="text-xs bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded-full">${escapeHtml(t)}</span>`
        ).join('');
        card.innerHTML = `
            <h3 class="font-bold text-gray-800 text-base leading-snug">${escapeHtml(m.title)}</h3>
            <p class="text-sm text-gray-500 line-clamp-3 flex-1">${m.content ? escapeHtml(m.content) : '<span class="italic text-gray-300">내용 없음</span>'}</p>
            ${tagHtml ? `<div class="flex flex-wrap gap-1">${tagHtml}</div>` : ''}
            <div class="text-xs text-gray-400">${m.createdAt ? new Date(m.createdAt).toLocaleDateString('ko-KR') : ''}</div>
            <div class="flex gap-2 mt-1">
                <button onclick="openEditModal(${m.id})"
                        class="flex-1 text-xs py-1.5 rounded-lg bg-emerald-50 text-emerald-600 hover:bg-emerald-100 font-semibold transition">수정</button>
                <button onclick="deleteMemo(${m.id})"
                        class="flex-1 text-xs py-1.5 rounded-lg bg-red-50 text-red-500 hover:bg-red-100 font-semibold transition">삭제</button>
            </div>
        `;
        return card;
    }

    function openCreateModal() {
        document.getElementById('modalTitle').textContent = '메모 추가';
        document.getElementById('formId').value = '';
        document.getElementById('formTitle').value = '';
        document.getElementById('formContent').value = '';
        document.getElementById('formTags').value = '';
        hideFormError();
        document.getElementById('formModal').classList.remove('hidden');
    }

    async function openEditModal(id) {
        try {
            const res = await fetch(`${API}/${id}`);
            if (!res.ok) throw new Error('Not found');
            const m = await res.json();
            document.getElementById('modalTitle').textContent = '메모 수정';
            document.getElementById('formId').value = m.id;
            document.getElementById('formTitle').value = m.title;
            document.getElementById('formContent').value = m.content || '';
            document.getElementById('formTags').value = m.tags || '';
            hideFormError();
            document.getElementById('formModal').classList.remove('hidden');
        } catch (e) {
            showToast('데이터 로드 실패', false);
        }
    }

    function closeFormModal() {
        document.getElementById('formModal').classList.add('hidden');
    }

    async function submitForm() {
        const id = document.getElementById('formId').value;
        const title = document.getElementById('formTitle').value.trim();
        const content = document.getElementById('formContent').value.trim();
        const tags = document.getElementById('formTags').value.trim();

        if (!title) { showFormError('제목을 입력해 주세요.'); return; }

        const payload = { title, content, tags };
        const isEdit = !!id;

        try {
            const res = await fetch(isEdit ? `${API}/${id}` : API, {
                method: isEdit ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('저장 실패');
            closeFormModal();
            showToast(isEdit ? '수정되었습니다.' : '추가되었습니다.');
            loadMemos();
        } catch (e) {
            showFormError(e.message);
        }
    }

    async function deleteMemo(id) {
        if (!confirm('정말 삭제하시겠습니까?')) return;
        try {
            const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('삭제 실패');
            showToast('삭제되었습니다.');
            loadMemos();
        } catch (e) {
            showToast(e.message, false);
        }
    }

    function showFormError(msg) {
        const el = document.getElementById('formError');
        el.textContent = msg;
        el.classList.remove('hidden');
    }

    function hideFormError() {
        document.getElementById('formError').classList.add('hidden');
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.appendChild(document.createTextNode(text));
        return div.innerHTML;
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeFormModal();
    });

    loadMemos();
</script>
</body>
</html>
