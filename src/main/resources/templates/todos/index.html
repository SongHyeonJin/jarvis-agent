<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>할 일 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- 헤더 -->
<header class="bg-blue-700 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
        <h1 class="text-2xl font-bold tracking-wide">할 일 관리</h1>
        <button onclick="openCreateModal()"
                class="bg-white text-blue-700 font-semibold px-4 py-2 rounded-lg hover:bg-blue-100 transition">
            + 할 일 추가
        </button>
    </div>
</header>

<!-- 필터 바 -->
<div class="max-w-6xl mx-auto px-4 mt-6">
    <div class="bg-white rounded-xl shadow p-4 flex flex-wrap gap-3 items-end">
        <div class="flex-1 min-w-[200px]">
            <label class="block text-sm font-medium text-gray-600 mb-1">제목 검색</label>
            <input id="searchTitle" type="text" placeholder="제목 입력..."
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
        <div class="min-w-[140px]">
            <label class="block text-sm font-medium text-gray-600 mb-1">완료 여부</label>
            <select id="filterDone"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option value="">전체</option>
                <option value="false">미완료</option>
                <option value="true">완료</option>
            </select>
        </div>
        <button onclick="loadTodos()"
                class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700 transition">
            검색
        </button>
        <button onclick="resetSearch()"
                class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-300 transition">
            초기화
        </button>
    </div>
</div>

<!-- 목록 -->
<main class="max-w-6xl mx-auto px-4 mt-6 pb-16">
    <div id="loadingSpinner" class="hidden flex justify-center py-10">
        <svg class="animate-spin h-8 w-8 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
        </svg>
    </div>
    <div id="emptyState" class="hidden text-center py-20 text-gray-400">
        <div class="text-5xl mb-4">✅</div>
        <p class="text-lg">등록된 할 일이 없습니다.</p>
    </div>
    <div id="todoGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
</main>

<!-- 생성/수정 모달 -->
<div id="formModal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg">
        <div class="flex items-center justify-between px-6 py-4 border-b">
            <h2 id="modalTitle" class="text-lg font-bold text-gray-800">할 일 추가</h2>
            <button onclick="closeFormModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
        </div>
        <form id="todoForm" class="px-6 py-5 space-y-4">
            <input type="hidden" id="formId" />
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">제목 <span class="text-red-500">*</span></label>
                <input id="formTitle" type="text" required
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
                       placeholder="할 일 제목" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">설명</label>
                <textarea id="formDescription" rows="3"
                          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
                          placeholder="상세 내용 입력..."></textarea>
            </div>
            <div class="flex gap-4">
                <div class="flex-1">
                    <label class="block text-sm font-medium text-gray-700 mb-1">우선순위</label>
                    <select id="formPriority"
                            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                        <option value="0">낮음 (0)</option>
                        <option value="1">보통 (1)</option>
                        <option value="2">높음 (2)</option>
                        <option value="3">긴급 (3)</option>
                    </select>
                </div>
                <div class="flex-1">
                    <label class="block text-sm font-medium text-gray-700 mb-1">마감일</label>
                    <input id="formDueDate" type="date"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
                </div>
            </div>
            <div id="formError" class="hidden bg-red-50 border border-red-300 text-red-600 text-sm rounded-lg px-3 py-2"></div>
        </form>
        <div class="flex justify-end gap-3 px-6 py-4 border-t bg-gray-50 rounded-b-2xl">
            <button onclick="closeFormModal()"
                    class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 transition">
                취소
            </button>
            <button onclick="submitForm()"
                    class="px-5 py-2 text-sm font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition">
                저장
            </button>
        </div>
    </div>
</div>

<!-- 알림 토스트 -->
<div id="toast" class="fixed bottom-6 right-6 z-50 hidden">
    <div id="toastContent" class="px-5 py-3 rounded-xl shadow-lg text-white text-sm font-medium"></div>
</div>

<script>
    const API = '/api/todos';
    const PRIORITY_LABELS = ['낮음', '보통', '높음', '긴급'];
    const PRIORITY_COLORS = [
        'bg-gray-100 text-gray-600',
        'bg-blue-100 text-blue-600',
        'bg-orange-100 text-orange-600',
        'bg-red-100 text-red-600'
    ];

    function showToast(message, success = true) {
        const toast = document.getElementById('toast');
        const content = document.getElementById('toastContent');
        content.textContent = message;
        content.className = 'px-5 py-3 rounded-xl shadow-lg text-white text-sm font-medium ' +
            (success ? 'bg-green-500' : 'bg-red-500');
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    async function loadTodos() {
        const spinner = document.getElementById('loadingSpinner');
        const grid = document.getElementById('todoGrid');
        const empty = document.getElementById('emptyState');

        spinner.classList.remove('hidden');
        grid.innerHTML = '';
        empty.classList.add('hidden');

        try {
            const res = await fetch(API);
            if (!res.ok) throw new Error('서버 오류');
            let todos = await res.json();

            const filterDone = document.getElementById('filterDone').value;
            const searchTitle = document.getElementById('searchTitle').value.trim().toLowerCase();
            if (filterDone !== '') todos = todos.filter(t => String(t.done) === filterDone);
            if (searchTitle) todos = todos.filter(t => t.title.toLowerCase().includes(searchTitle));

            spinner.classList.add('hidden');
            if (todos.length === 0) { empty.classList.remove('hidden'); return; }
            todos.forEach(t => grid.appendChild(createCard(t)));
        } catch (e) {
            spinner.classList.add('hidden');
            showToast('목록 로드 실패: ' + e.message, false);
        }
    }

    function resetSearch() {
        document.getElementById('searchTitle').value = '';
        document.getElementById('filterDone').value = '';
        loadTodos();
    }

    function createCard(t) {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl shadow hover:shadow-md transition p-5 flex flex-col gap-3';
        const priorityColor = PRIORITY_COLORS[t.priority] || PRIORITY_COLORS[0];
        const priorityLabel = PRIORITY_LABELS[t.priority] || '낮음';
        const doneClass = t.done ? 'line-through text-gray-400' : 'text-gray-800';
        card.innerHTML = `
            <div class="flex items-start justify-between gap-2">
                <h3 class="font-bold text-base leading-snug flex-1 ${doneClass}">${escapeHtml(t.title)}</h3>
                <span class="text-xs font-semibold px-2 py-1 rounded-full whitespace-nowrap ${priorityColor}">${priorityLabel}</span>
            </div>
            <p class="text-sm text-gray-500 line-clamp-2">${t.description ? escapeHtml(t.description) : '<span class="italic text-gray-300">설명 없음</span>'}</p>
            <div class="flex items-center justify-between mt-auto text-xs text-gray-400">
                <span>${t.dueDate ? '마감: ' + t.dueDate : ''}</span>
                <span class="${t.done ? 'text-green-500 font-semibold' : 'text-gray-400'}">${t.done ? '✓ 완료' : '미완료'}</span>
            </div>
            <div class="flex gap-2 mt-1">
                <button onclick="toggleDone(${t.id})"
                        class="flex-1 text-xs py-1.5 rounded-lg ${t.done ? 'bg-gray-100 text-gray-600 hover:bg-gray-200' : 'bg-green-50 text-green-600 hover:bg-green-100'} font-semibold transition">
                    ${t.done ? '↩ 되돌리기' : '✓ 완료'}
                </button>
                <button onclick="openEditModal(${t.id})"
                        class="flex-1 text-xs py-1.5 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 font-semibold transition">수정</button>
                <button onclick="deleteTodo(${t.id})"
                        class="flex-1 text-xs py-1.5 rounded-lg bg-red-50 text-red-500 hover:bg-red-100 font-semibold transition">삭제</button>
            </div>
        `;
        return card;
    }

    function openCreateModal() {
        document.getElementById('modalTitle').textContent = '할 일 추가';
        document.getElementById('formId').value = '';
        document.getElementById('formTitle').value = '';
        document.getElementById('formDescription').value = '';
        document.getElementById('formPriority').value = '0';
        document.getElementById('formDueDate').value = '';
        hideFormError();
        document.getElementById('formModal').classList.remove('hidden');
    }

    async function openEditModal(id) {
        try {
            const res = await fetch(`${API}/${id}`);
            if (!res.ok) throw new Error('Not found');
            const t = await res.json();
            document.getElementById('modalTitle').textContent = '할 일 수정';
            document.getElementById('formId').value = t.id;
            document.getElementById('formTitle').value = t.title;
            document.getElementById('formDescription').value = t.description || '';
            document.getElementById('formPriority').value = t.priority;
            document.getElementById('formDueDate').value = t.dueDate || '';
            hideFormError();
            document.getElementById('formModal').classList.remove('hidden');
        } catch (e) {
            showToast('데이터 로드 실패', false);
        }
    }

    function closeFormModal() {
        document.getElementById('formModal').classList.add('hidden');
    }

    async function submitForm() {
        const id = document.getElementById('formId').value;
        const title = document.getElementById('formTitle').value.trim();
        const description = document.getElementById('formDescription').value.trim();
        const priority = parseInt(document.getElementById('formPriority').value);
        const dueDate = document.getElementById('formDueDate').value || null;

        if (!title) { showFormError('제목을 입력해 주세요.'); return; }

        const payload = { title, description, priority, dueDate };
        const isEdit = !!id;

        try {
            const res = await fetch(isEdit ? `${API}/${id}` : API, {
                method: isEdit ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('저장 실패');
            closeFormModal();
            showToast(isEdit ? '수정되었습니다.' : '추가되었습니다.');
            loadTodos();
        } catch (e) {
            showFormError(e.message);
        }
    }

    async function toggleDone(id) {
        try {
            const res = await fetch(`${API}/${id}/toggle`, { method: 'PATCH' });
            if (!res.ok) throw new Error('처리 실패');
            loadTodos();
        } catch (e) {
            showToast(e.message, false);
        }
    }

    async function deleteTodo(id) {
        if (!confirm('정말 삭제하시겠습니까?')) return;
        try {
            const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('삭제 실패');
            showToast('삭제되었습니다.');
            loadTodos();
        } catch (e) {
            showToast(e.message, false);
        }
    }

    function showFormError(msg) {
        const el = document.getElementById('formError');
        el.textContent = msg;
        el.classList.remove('hidden');
    }

    function hideFormError() {
        document.getElementById('formError').classList.add('hidden');
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.appendChild(document.createTextNode(text));
        return div.innerHTML;
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeFormModal();
    });

    loadTodos();
</script>
</body>
</html>
