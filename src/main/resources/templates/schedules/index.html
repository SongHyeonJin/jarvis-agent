<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>일정 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- 헤더 -->
<header class="bg-violet-700 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
        <h1 class="text-2xl font-bold tracking-wide">일정 관리</h1>
        <button onclick="openCreateModal()"
                class="bg-white text-violet-700 font-semibold px-4 py-2 rounded-lg hover:bg-violet-100 transition">
            + 일정 추가
        </button>
    </div>
</header>

<!-- 날짜 필터 바 -->
<div class="max-w-6xl mx-auto px-4 mt-6">
    <div class="bg-white rounded-xl shadow p-4 flex flex-wrap gap-3 items-end">
        <div class="flex-1 min-w-[160px]">
            <label class="block text-sm font-medium text-gray-600 mb-1">시작일</label>
            <input id="filterFrom" type="date"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400" />
        </div>
        <div class="flex-1 min-w-[160px]">
            <label class="block text-sm font-medium text-gray-600 mb-1">종료일</label>
            <input id="filterTo" type="date"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400" />
        </div>
        <button onclick="loadSchedules()"
                class="bg-violet-600 text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-violet-700 transition">
            검색
        </button>
        <button onclick="resetSearch()"
                class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-300 transition">
            초기화
        </button>
    </div>
</div>

<!-- 목록 -->
<main class="max-w-6xl mx-auto px-4 mt-6 pb-16">
    <div id="loadingSpinner" class="hidden flex justify-center py-10">
        <svg class="animate-spin h-8 w-8 text-violet-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
        </svg>
    </div>
    <div id="emptyState" class="hidden text-center py-20 text-gray-400">
        <div class="text-5xl mb-4">📅</div>
        <p class="text-lg">등록된 일정이 없습니다.</p>
    </div>
    <div id="scheduleGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
</main>

<!-- 생성/수정 모달 -->
<div id="formModal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg">
        <div class="flex items-center justify-between px-6 py-4 border-b">
            <h2 id="modalTitle" class="text-lg font-bold text-gray-800">일정 추가</h2>
            <button onclick="closeFormModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
        </div>
        <form id="scheduleForm" class="px-6 py-5 space-y-4">
            <input type="hidden" id="formId" />
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">제목 <span class="text-red-500">*</span></label>
                <input id="formTitle" type="text" required
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400"
                       placeholder="일정 제목" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">설명</label>
                <textarea id="formDescription" rows="3"
                          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400"
                          placeholder="일정 내용 입력..."></textarea>
            </div>
            <div class="flex gap-4">
                <div class="flex-1">
                    <label class="block text-sm font-medium text-gray-700 mb-1">시작 시간 <span class="text-red-500">*</span></label>
                    <input id="formStartTime" type="datetime-local" required
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400" />
                </div>
                <div class="flex-1">
                    <label class="block text-sm font-medium text-gray-700 mb-1">종료 시간</label>
                    <input id="formEndTime" type="datetime-local"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400" />
                </div>
            </div>
            <div id="formError" class="hidden bg-red-50 border border-red-300 text-red-600 text-sm rounded-lg px-3 py-2"></div>
        </form>
        <div class="flex justify-end gap-3 px-6 py-4 border-t bg-gray-50 rounded-b-2xl">
            <button onclick="closeFormModal()"
                    class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 transition">
                취소
            </button>
            <button onclick="submitForm()"
                    class="px-5 py-2 text-sm font-semibold text-white bg-violet-600 rounded-lg hover:bg-violet-700 transition">
                저장
            </button>
        </div>
    </div>
</div>

<!-- 알림 토스트 -->
<div id="toast" class="fixed bottom-6 right-6 z-50 hidden">
    <div id="toastContent" class="px-5 py-3 rounded-xl shadow-lg text-white text-sm font-medium"></div>
</div>

<script>
    const API = '/api/schedules';

    function showToast(message, success = true) {
        const toast = document.getElementById('toast');
        const content = document.getElementById('toastContent');
        content.textContent = message;
        content.className = 'px-5 py-3 rounded-xl shadow-lg text-white text-sm font-medium ' +
            (success ? 'bg-green-500' : 'bg-red-500');
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function formatDateTime(dt) {
        if (!dt) return '';
        return new Date(dt).toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    function toLocalDateTimeInput(dt) {
        if (!dt) return '';
        const d = new Date(dt);
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    async function loadSchedules() {
        const spinner = document.getElementById('loadingSpinner');
        const grid = document.getElementById('scheduleGrid');
        const empty = document.getElementById('emptyState');

        spinner.classList.remove('hidden');
        grid.innerHTML = '';
        empty.classList.add('hidden');

        const from = document.getElementById('filterFrom').value;
        const to = document.getElementById('filterTo').value;

        let url = API;
        if (from && to) {
            url += `?from=${encodeURIComponent(from + ' 00:00')}&to=${encodeURIComponent(to + ' 23:59')}`;
        }

        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error('서버 오류');
            const schedules = await res.json();
            spinner.classList.add('hidden');
            if (schedules.length === 0) { empty.classList.remove('hidden'); return; }
            schedules.forEach(s => grid.appendChild(createCard(s)));
        } catch (e) {
            spinner.classList.add('hidden');
            showToast('목록 로드 실패: ' + e.message, false);
        }
    }

    function resetSearch() {
        document.getElementById('filterFrom').value = '';
        document.getElementById('filterTo').value = '';
        loadSchedules();
    }

    function createCard(s) {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl shadow hover:shadow-md transition p-5 flex flex-col gap-3';
        card.innerHTML = `
            <h3 class="font-bold text-gray-800 text-base leading-snug">${escapeHtml(s.title)}</h3>
            <p class="text-sm text-gray-500 line-clamp-2">${s.description ? escapeHtml(s.description) : '<span class="italic text-gray-300">설명 없음</span>'}</p>
            <div class="text-xs space-y-1">
                <div class="flex items-center gap-1 text-violet-600">
                    <span class="font-semibold">시작:</span>
                    <span>${formatDateTime(s.startTime)}</span>
                </div>
                ${s.endTime ? `<div class="flex items-center gap-1 text-gray-500"><span class="font-semibold">종료:</span><span>${formatDateTime(s.endTime)}</span></div>` : ''}
            </div>
            <div class="flex gap-2 mt-auto">
                <button onclick="openEditModal(${s.id})"
                        class="flex-1 text-xs py-1.5 rounded-lg bg-violet-50 text-violet-600 hover:bg-violet-100 font-semibold transition">수정</button>
                <button onclick="deleteSchedule(${s.id})"
                        class="flex-1 text-xs py-1.5 rounded-lg bg-red-50 text-red-500 hover:bg-red-100 font-semibold transition">삭제</button>
            </div>
        `;
        return card;
    }

    function openCreateModal() {
        document.getElementById('modalTitle').textContent = '일정 추가';
        document.getElementById('formId').value = '';
        document.getElementById('formTitle').value = '';
        document.getElementById('formDescription').value = '';
        document.getElementById('formStartTime').value = '';
        document.getElementById('formEndTime').value = '';
        hideFormError();
        document.getElementById('formModal').classList.remove('hidden');
    }

    async function openEditModal(id) {
        try {
            const res = await fetch(`${API}/${id}`);
            if (!res.ok) throw new Error('Not found');
            const s = await res.json();
            document.getElementById('modalTitle').textContent = '일정 수정';
            document.getElementById('formId').value = s.id;
            document.getElementById('formTitle').value = s.title;
            document.getElementById('formDescription').value = s.description || '';
            document.getElementById('formStartTime').value = toLocalDateTimeInput(s.startTime);
            document.getElementById('formEndTime').value = toLocalDateTimeInput(s.endTime);
            hideFormError();
            document.getElementById('formModal').classList.remove('hidden');
        } catch (e) {
            showToast('데이터 로드 실패', false);
        }
    }

    function closeFormModal() {
        document.getElementById('formModal').classList.add('hidden');
    }

    async function submitForm() {
        const id = document.getElementById('formId').value;
        const title = document.getElementById('formTitle').value.trim();
        const description = document.getElementById('formDescription').value.trim();
        const startTime = document.getElementById('formStartTime').value;
        const endTime = document.getElementById('formEndTime').value || null;

        if (!title) { showFormError('제목을 입력해 주세요.'); return; }
        if (!startTime) { showFormError('시작 시간을 입력해 주세요.'); return; }

        const payload = { title, description, startTime, endTime };
        const isEdit = !!id;

        try {
            const res = await fetch(isEdit ? `${API}/${id}` : API, {
                method: isEdit ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('저장 실패');
            closeFormModal();
            showToast(isEdit ? '수정되었습니다.' : '추가되었습니다.');
            loadSchedules();
        } catch (e) {
            showFormError(e.message);
        }
    }

    async function deleteSchedule(id) {
        if (!confirm('정말 삭제하시겠습니까?')) return;
        try {
            const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('삭제 실패');
            showToast('삭제되었습니다.');
            loadSchedules();
        } catch (e) {
            showToast(e.message, false);
        }
    }

    function showFormError(msg) {
        const el = document.getElementById('formError');
        el.textContent = msg;
        el.classList.remove('hidden');
    }

    function hideFormError() {
        document.getElementById('formError').classList.add('hidden');
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.appendChild(document.createTextNode(text));
        return div.innerHTML;
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeFormModal();
    });

    loadSchedules();
</script>
</body>
</html>
