spring:
  application:
    name: jarvis-agent
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:./data/jarvisdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-6
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:1b

ai:
  openai:
    api-key: ${OPENAI_API_KEY}
    model: gpt-4o-mini
    base-url: https://api.openai.com/v1

server:
  port: 8081

anthropic:
  api-key: ${ANTHROPIC_API_KEY}
  model: claude-sonnet-4-6

# 대화 복잡도별 라우팅에 사용할 실제 모델 ID
jarvis:
  ai:
    model:
      opus: claude-opus-4-8
      sonnet: claude-sonnet-4-6
      haiku: claude-haiku-4-5-20251001
      ollama: llama3.2:1b

app:
  project-root: d:/jarvis-agent
  workspace-root: d:/jarvis-workspaces

logging:
  level:
    com.jarvis: INFO
