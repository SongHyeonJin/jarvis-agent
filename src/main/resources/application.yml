spring:
  application:
    name: jarvis-agent
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:./data/jarvisdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

